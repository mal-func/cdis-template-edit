[project]
name = "cdis-backend-fastapi"
version = "0.1.0"
description = "FastAPI alternative backend for CDIS"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.34,<1.0", "sqlalchemy[asyncio]>=2.0,<3.0", "asyncmy>=0.2,<1.0", "pydantic-settings>=2.7,<3.0", "PyJWT>=2.10,<3.0", "pwdlib[argon2]>=0.2,<1.0", "email-validator>=2.2,<3.0"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.28,<1.0", "ruff>=0.9,<1.0"]
[tool.ruff]
line-length = 100
target-version = "py312"
