name: FastAPI Backend Validation

on:
  pull_request:
    paths:
      - "back-end/fastapi/**"
      - ".github/workflows/fastapi-validation.yml"
  push:
    branches: ["**"]
    paths:
      - "back-end/fastapi/**"
      - ".github/workflows/fastapi-validation.yml"

jobs:
  validate:
    name: Lint, migrate and test FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end/fastapi
    env:
      JWT_ACCESS_SECRET: test-secret-that-is-long-enough-for-cdis
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/fastapi/pyproject.toml

      - name: Install FastAPI dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
