name: FastAPI Backend Validation

on:
  pull_request:
    paths:
      - "back-end/fastapi/**"
      - ".github/workflows/fastapi-validation.yml"
  push:
    branches: ["main"]
    paths:
      - "back-end/fastapi/**"
      - ".github/workflows/fastapi-validation.yml"

jobs:
  validate:
    name: Lint, migrate and test FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end/fastapi
    env:
      JWT_ACCESS_SECRET: test-secret-that-is-long-enough-for-cdis
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      NODE_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/fastapi/pyproject.toml

      - name: Install FastAPI dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

      - name: Verify database seed is idempotent
        env:
          DATABASE_URL: "sqlite+aiosqlite:////tmp/cdis-seed-smoke.db"
          SEED_ADMIN_EMAIL: seed-admin@example.com
          SEED_ADMIN_PASSWORD: seed-admin-password
          SEED_ADMIN_NAME: Seed Admin
        run: |
          alembic upgrade head
          python -m app.seed
          python -m app.seed
