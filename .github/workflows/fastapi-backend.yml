name: FastAPI Backend
on:
  pull_request:
    paths:
      - "back-end/fastapi/**"
      - "deployment/compose/compose.fastapi.yaml"
      - "deployment/scripts/e2e-up.sh"
      - "deployment/e2e/**"
      - ".github/workflows/fastapi-backend.yml"
  push:
    branches: ["**"]
    paths:
      - "back-end/fastapi/**"
      - "deployment/compose/compose.fastapi.yaml"
      - "deployment/scripts/e2e-up.sh"
      - "deployment/e2e/**"
      - ".github/workflows/fastapi-backend.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end/fastapi
    env:
      JWT_ACCESS_SECRET: test-secret-that-is-long-enough-for-cdis
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/fastapi/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest

      - name: Prepare FastAPI end-to-end stack
        working-directory: .
        run: |
          cat > deployment/compose/.env <<'EOF'
          DB_PASSWORD=cdis_ci_password
          DB_ROOT_PASSWORD=cdis_ci_root_password
          JWT_ACCESS_SECRET=ci-secret-that-is-long-enough-and-randomized-for-tests
          PUBLIC_ORIGIN=http://localhost:8080
          SEED_ADMIN_EMAIL=e2e-admin@example.com
          SEED_ADMIN_PASSWORD=e2e-admin-password
          SEED_ADMIN_NAME=E2E Admin
          EOF

      - name: Build and start FastAPI + React + MySQL
        working-directory: .
        run: docker compose --env-file deployment/compose/.env -f deployment/compose/compose.yaml -f deployment/compose/compose.fastapi.yaml up -d --build

      - name: Apply migrations and seed demo data
        working-directory: .
        run: docker compose --env-file deployment/compose/.env -f deployment/compose/compose.yaml -f deployment/compose/compose.fastapi.yaml run --rm migrate

      - name: Wait for integrated stack
        working-directory: .
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS http://localhost:8080/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose --env-file deployment/compose/.env -f deployment/compose/compose.yaml -f deployment/compose/compose.fastapi.yaml logs
          exit 1

      - name: Install Playwright dependencies
        working-directory: deployment
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run shared browser suite against FastAPI
        working-directory: deployment
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_EMAIL: e2e-admin@example.com
          E2E_ADMIN_PASSWORD: e2e-admin-password
        run: npm run test:e2e

      - name: Tear down integration stack
        if: always()
        working-directory: .
        run: docker compose --env-file deployment/compose/.env -f deployment/compose/compose.yaml -f deployment/compose/compose.fastapi.yaml down -v
