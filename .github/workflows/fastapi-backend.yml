name: FastAPI Backend
on:
  pull_request:
    paths:
      - "back-end/fastapi/**"
      - ".github/workflows/fastapi-backend.yml"
  push:
    branches: ["**"]
    paths:
      - "back-end/fastapi/**"
      - ".github/workflows/fastapi-backend.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end/fastapi
    env:
      JWT_ACCESS_SECRET: test-secret-that-is-long-enough-for-cdis
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: back-end/fastapi/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: alembic upgrade head
      - run: pytest
