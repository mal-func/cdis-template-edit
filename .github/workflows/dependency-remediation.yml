name: Dependency Remediation

on:
  push:
    branches: ["**"]
    paths:
      - "back-end/express/package.json"
      - "back-end/express/package-lock.json"
      - "front-end/react/package.json"
      - "front-end/react/package-lock.json"
      - "deployment/package.json"
      - "deployment/package-lock.json"
      - ".github/workflows/dependency-remediation.yml"

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out working branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Apply non-breaking dependency security updates
        run: |
          set -e
          for directory in back-end/express front-end/react deployment; do
            echo "Updating dependencies in $directory"
            (cd "$directory" && npm audit fix)
          done

      - name: Verify high-severity advisories are resolved
        run: |
          set -e
          for directory in back-end/express front-end/react deployment; do
            echo "Auditing $directory"
            (cd "$directory" && npm audit --audit-level=high)
          done

      - name: Commit updated dependency locks
        env:
          HEAD_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$(git status --porcelain -- back-end/express front-end/react deployment)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add back-end/express/package.json back-end/express/package-lock.json
            git add front-end/react/package.json front-end/react/package-lock.json
            git add deployment/package.json deployment/package-lock.json
            git commit -m "chore(deps): apply non-breaking security updates"
            git fetch origin "$HEAD_BRANCH"
            git rebase FETCH_HEAD
            git push origin "HEAD:$HEAD_BRANCH"
          else
            echo "No dependency changes were required."
          fi
