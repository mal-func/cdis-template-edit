name: Vue Frontend
permissions:
  contents: write
on:
  pull_request:
    paths:
      - "front-end/vue/**"
      - ".github/workflows/vue-frontend.yml"
  push:
    branches: [main]
    paths:
      - "front-end/vue/**"
      - ".github/workflows/vue-frontend.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end/vue
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Vue dependencies
        run: |
          npm install --global npm@11
          npm cache clean --force
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund --legacy-peer-deps
          fi
      - name: Commit generated Vue lockfile (one-time bootstrap)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        working-directory: .
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if [ -f front-end/vue/package-lock.json ] && [ -n "$(git status --porcelain -- front-end/vue/package-lock.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add front-end/vue/package-lock.json
            git commit -m "chore(vue): add reproducible npm lockfile"
            git push origin "HEAD:${HEAD_BRANCH}"
          fi
      - name: Verify clean Vue dependency install
        run: npm ci
      - name: Preserve generated dependency lockfile for review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: vue-package-lock
          path: front-end/vue/package-lock.json
          if-no-files-found: warn
          retention-days: 7
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_APP_NAME: CDIS
          VITE_APP_ENV: testing
          VITE_API_BASE_URL: /api/v1